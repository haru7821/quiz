<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>생명과학 퀴즈 — 고2 생명과학Ⅰ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #07080f;
    --surface: #0e1020;
    --card: #13162a;
    --card-hover: #181c33;
    --border: rgba(255,255,255,0.07);
    --border-active: rgba(0,224,175,0.5);
    --accent: #00e0af;
    --accent2: #4f8eff;
    --accent3: #ff6b6b;
    --success: #00e0af;
    --error: #ff5c72;
    --text: #e8eaf6;
    --text-muted: #7880a8;
    --text-dim: #3d4468;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 15% 10%, rgba(0,224,175,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 90%, rgba(79,142,255,0.06) 0%, transparent 60%);
  }

  /* ── GRID BG ── */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  #app {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 0 16px 60px;
  }

  /* ── HEADER ── */
  .site-header {
    width: 100%; max-width: 860px;
    padding: 28px 0 20px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--text);
  }

  .logo-sub {
    font-size: 11px; font-weight: 400; color: var(--text-muted);
    font-family: 'Space Mono', monospace;
  }

  /* ── VIEWS ── */
  .view { width: 100%; max-width: 860px; display: none; }
  .view.active { display: block; animation: fadeUp 0.4s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── HOME VIEW ── */
  .hero {
    text-align: center;
    padding: 48px 0 40px;
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,224,175,0.1);
    border: 1px solid rgba(0,224,175,0.25);
    border-radius: 100px;
    padding: 4px 14px;
    font-size: 12px; font-weight: 500;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }

  .hero-title {
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  .hero-title span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-desc {
    font-size: 16px; color: var(--text-muted); font-weight: 300;
    max-width: 420px; margin: 0 auto 40px;
    line-height: 1.7;
  }

  .stats-row {
    display: flex; justify-content: center; gap: 32px;
    margin-bottom: 48px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-size: 28px; font-weight: 900;
    font-family: 'Space Mono', monospace;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 12px; color: var(--text-muted); font-weight: 400;
    margin-top: 2px;
  }

  /* ── UNIT GRID ── */
  .section-title {
    font-size: 13px; font-weight: 700;
    color: var(--text-muted); letter-spacing: 0.12em;
    text-transform: uppercase; font-family: 'Space Mono', monospace;
    margin-bottom: 16px;
  }

  .unit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .unit-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  .unit-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.25s ease;
  }

  .unit-card:hover {
    background: var(--card-hover);
    border-color: rgba(0,224,175,0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .unit-card:hover::before { transform: scaleX(1); }

  .unit-card.selected {
    background: rgba(0,224,175,0.08);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(0,224,175,0.12);
  }

  .unit-card.selected::before { transform: scaleX(1); }

  .unit-num {
    font-size: 11px; font-weight: 700;
    color: var(--accent); font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em; margin-bottom: 8px;
  }

  .unit-name {
    font-size: 14px; font-weight: 700; line-height: 1.4;
    margin-bottom: 8px;
  }

  .unit-count {
    font-size: 12px; color: var(--text-muted);
  }

  .unit-check {
    position: absolute; top: 14px; right: 14px;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #000; font-weight: 900;
    opacity: 0; transform: scale(0.5);
    transition: all 0.2s ease;
  }

  .unit-card.selected .unit-check {
    opacity: 1; transform: scale(1);
  }

  /* ALL/CLEAR buttons */
  .select-actions {
    display: flex; gap: 8px; margin-bottom: 24px;
  }

  .btn-secondary {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .btn-secondary:hover {
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
    background: rgba(255,255,255,0.05);
  }

  /* ── PRIMARY BTN ── */
  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px;
    background: linear-gradient(135deg, var(--accent) 0%, #00bfa3 100%);
    border: none; border-radius: var(--radius);
    font-size: 16px; font-weight: 700;
    color: #07080f;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Sans KR', sans-serif;
    letter-spacing: 0.02em;
    max-width: 860px;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,224,175,0.3);
    background: linear-gradient(135deg, #00f5c0, var(--accent));
  }

  .btn-primary:disabled {
    opacity: 0.3; cursor: not-allowed;
    transform: none; box-shadow: none;
  }

  .btn-arrow { font-size: 20px; transition: transform 0.2s; }
  .btn-primary:hover .btn-arrow { transform: translateX(4px); }

  /* ── QUIZ VIEW ── */
  .quiz-header {
    padding: 20px 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }

  .quiz-back {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-muted);
    cursor: pointer; border: none; background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    transition: color 0.2s;
    padding: 6px 0;
  }

  .quiz-back:hover { color: var(--text); }

  .quiz-meta {
    display: flex; align-items: center; gap: 16px;
  }

  .quiz-counter {
    font-family: 'Space Mono', monospace;
    font-size: 13px; color: var(--text-muted);
  }

  .quiz-counter span { color: var(--accent); font-weight: 700; }

  .timer-badge {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 13px; color: var(--text);
  }

  .timer-badge.warning { border-color: rgba(255,107,107,0.4); color: #ff6b6b; }
  .timer-badge .timer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  .timer-badge.warning .timer-dot { background: #ff6b6b; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* progress */
  .progress-track {
    width: 100%; height: 3px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 32px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* Question */
  .q-unit-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(79,142,255,0.1);
    border: 1px solid rgba(79,142,255,0.25);
    border-radius: 100px;
    padding: 4px 12px;
    font-size: 12px; color: var(--accent2);
    font-weight: 500; margin-bottom: 16px;
  }

  .q-text {
    font-size: clamp(17px, 3.5vw, 21px);
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 28px;
  }

  /* Options */
  .options-list {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 32px;
  }

  .option-btn {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    font-size: 15px; line-height: 1.5; font-weight: 400;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .option-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(0,224,175,0.04));
    opacity: 0; transition: opacity 0.2s;
  }

  .option-btn:hover:not(:disabled) {
    border-color: rgba(0,224,175,0.4);
    background: var(--card-hover);
    transform: translateX(3px);
  }

  .option-btn:hover:not(:disabled)::before { opacity: 1; }

  .option-num {
    min-width: 26px; height: 26px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    flex-shrink: 0;
    transition: all 0.18s;
    margin-top: 1px;
  }

  .option-btn:hover:not(:disabled) .option-num {
    background: rgba(0,224,175,0.2);
    color: var(--accent);
  }

  /* Answer states */
  .option-btn.correct {
    border-color: var(--success);
    background: rgba(0,224,175,0.08);
    pointer-events: none;
  }

  .option-btn.correct .option-num {
    background: var(--success);
    color: #000;
  }

  .option-btn.wrong {
    border-color: var(--error);
    background: rgba(255,92,114,0.06);
    pointer-events: none;
  }

  .option-btn.wrong .option-num {
    background: var(--error);
    color: #fff;
  }

  .option-btn.neutral { pointer-events: none; opacity: 0.5; }

  /* Explanation box */
  .explain-box {
    background: rgba(0,224,175,0.05);
    border: 1px solid rgba(0,224,175,0.2);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    margin-bottom: 24px;
    animation: fadeUp 0.3s ease;
    display: none;
  }

  .explain-box.show { display: block; }

  .explain-label {
    font-size: 11px; font-weight: 700;
    color: var(--accent); font-family: 'Space Mono', monospace;
    letter-spacing: 0.08em; margin-bottom: 8px;
  }

  .explain-text {
    font-size: 14px; color: var(--text-muted); line-height: 1.65;
  }

  /* Next btn */
  .btn-next {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px;
    background: var(--accent);
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700;
    color: #07080f; cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
    display: none;
  }

  .btn-next.show { display: flex; }
  .btn-next:hover { background: #00f5c0; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,224,175,0.25); }

  /* ── RESULT VIEW ── */
  .result-header {
    text-align: center;
    padding: 48px 0 32px;
  }

  .result-grade {
    width: 100px; height: 100px;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px; font-weight: 900;
    font-family: 'Space Mono', monospace;
    position: relative;
  }

  .result-grade::before {
    content: ''; position: absolute; inset: -3px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--surface) 0);
    z-index: -1;
  }

  .result-grade::after {
    content: ''; position: absolute; inset: 3px;
    border-radius: 50%; background: var(--bg); z-index: -1;
  }

  .result-score-big {
    font-size: clamp(42px, 9vw, 68px);
    font-weight: 900;
    font-family: 'Space Mono', monospace;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .result-label {
    font-size: 18px; font-weight: 700; margin-bottom: 8px;
  }

  .result-sub {
    font-size: 14px; color: var(--text-muted);
  }

  /* score cards */
  .result-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
  }

  .stat-card-num {
    font-size: 24px; font-weight: 900;
    font-family: 'Space Mono', monospace;
    margin-bottom: 4px;
  }

  .stat-card-num.green { color: var(--accent); }
  .stat-card-num.red { color: var(--error); }
  .stat-card-num.blue { color: var(--accent2); }

  .stat-card-label {
    font-size: 12px; color: var(--text-muted);
  }

  /* Review list */
  .review-section { margin-bottom: 32px; }

  .review-title {
    font-size: 13px; font-weight: 700;
    color: var(--text-muted); letter-spacing: 0.12em;
    text-transform: uppercase; font-family: 'Space Mono', monospace;
    margin-bottom: 12px;
  }

  .review-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 8px;
    font-size: 14px; line-height: 1.6;
  }

  .review-item-q {
    font-weight: 600; margin-bottom: 6px;
  }

  .review-item-row {
    display: flex; gap: 12px; font-size: 13px;
  }

  .ri-wrong { color: var(--error); }
  .ri-correct { color: var(--accent); }

  /* restart btns */
  .result-actions {
    display: flex; gap: 10px; flex-direction: column;
  }

  .btn-outline {
    padding: 14px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .btn-outline:hover {
    border-color: rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.04);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .unit-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .unit-card { padding: 14px; }
    .unit-name { font-size: 12px; }
    .unit-count { font-size: 11px; }
    .stats-row { gap: 20px; }
    .result-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-card { padding: 12px 8px; }
    .stat-card-num { font-size: 20px; }
    .quiz-header { padding: 14px 0 18px; }
    .timer-badge { padding: 4px 9px; font-size: 12px; }
  }

  @media (max-width: 360px) {
    .unit-grid { grid-template-columns: 1fr; }
    .result-stats { grid-template-columns: repeat(3, 1fr); }
  }

  /* ── AI MODAL ── */
  /* feedback flash */
  @keyframes flashGreen {
    0% { background: rgba(0,224,175,0.25); }
    100% { background: transparent; }
  }
  @keyframes flashRed {
    0% { background: rgba(255,92,114,0.25); }
    100% { background: transparent; }
  }

  .flash-correct { animation: flashGreen 0.5s ease; }
  .flash-wrong { animation: flashRed 0.5s ease; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">
      <div class="logo-icon">🧬</div>
      <div>
        <div class="logo-text">생명과학 퀴즈</div>
        <div class="logo-sub">고2 생명과학Ⅰ</div>
      </div>
    </div>
  </header>

  <!-- ── VIEW: HOME ── -->
  <div id="view-home" class="view active">
    <div class="hero">
      <div class="hero-badge">📚 요점정리 기반 퀴즈</div>
      <h1 class="hero-title">생명과학<span>Ⅰ</span><br>완전정복 퀴즈</h1>
      <p class="hero-desc">단원을 선택하고 퀴즈를 풀어보세요.<br>취약한 단원을 집중적으로 학습할 수 있습니다.</p>
      <div class="stats-row">
        <div class="stat-item"><div class="stat-num">11</div><div class="stat-label">단원</div></div>
        <div class="stat-item"><div class="stat-num">220</div><div class="stat-label">문제</div></div>
        <div class="stat-item"><div class="stat-num">30s</div><div class="stat-label">문제당 시간</div></div>
      </div>
    </div>

    <div class="section-title">단원 선택</div>

    <div class="select-actions">
      <button class="btn-secondary" onclick="selectAll()">전체 선택</button>
      <button class="btn-secondary" onclick="clearAll()">전체 해제</button>
    </div>

    <div class="unit-grid" id="unit-grid"></div>

    <button class="btn-primary" id="start-btn" onclick="startQuiz()" disabled>
      퀴즈 시작하기 <span class="btn-arrow">→</span>
    </button>
  </div>

  <!-- ── VIEW: QUIZ ── -->
  <div id="view-quiz" class="view">
    <div class="quiz-header">
      <button class="quiz-back" onclick="goHome()">← 단원 선택</button>
      <div class="quiz-meta">
        <span class="quiz-counter"><span id="q-current">1</span> / <span id="q-total">0</span></span>
        <div class="timer-badge" id="timer-badge">
          <div class="timer-dot"></div>
          <span id="timer-display">30</span>
        </div>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="q-unit-tag" id="q-unit-tag">단원</div>
    <div class="q-text" id="q-text">문제가 여기에 표시됩니다.</div>

    <div class="options-list" id="options-list"></div>

    <div class="explain-box" id="explain-box">
      <div class="explain-label">해설</div>
      <div class="explain-text" id="explain-text"></div>
    </div>

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let selectedUnits = [];
let quizQuestions = [];
let currentIdx = 0;
let score = 0;
let answered = false;
let timerInterval = null;
let timeLeft = 30;
let totalTime = 0;
let startTime = null;
let wrongAnswers = [];
let selectedForRetry = [];

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
function init() {
  const grid = document.getElementById('unit-grid');
  grid.innerHTML = '';
  UNITS.forEach(unit => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.dataset.id = unit.id;
    card.innerHTML = `
      <div class="unit-num">${unit.short}</div>
      <div class="unit-name">${unit.name}</div>
      <div class="unit-count">문제 ${unit.questions.length}개</div>
      <div class="unit-check">✓</div>
    `;
    card.addEventListener('click', () => toggleUnit(unit.id));
    grid.appendChild(card);
  });
}

function toggleUnit(id) {
  const idx = selectedUnits.indexOf(id);
  if (idx > -1) {
    selectedUnits.splice(idx, 1);
  } else {
    selectedUnits.push(id);
  }
  updateUnitUI();
}

function selectAll() {
  selectedUnits = UNITS.map(u => u.id);
  updateUnitUI();
}

function clearAll() {
  selectedUnits = [];
  updateUnitUI();
}

function updateUnitUI() {
  document.querySelectorAll('.unit-card').forEach(card => {
    const id = parseInt(card.dataset.id);
    card.classList.toggle('selected', selectedUnits.includes(id));
  });
  document.getElementById('start-btn').disabled = selectedUnits.length === 0;
}

// ══════════════════════════════════════════
//  QUIZ
// ══════════════════════════════════════════
function startQuiz() {
  selectedForRetry = [...selectedUnits];
  quizQuestions = [];
  selectedUnits.forEach(uid => {
    const unit = UNITS.find(u => u.id === uid);
    if (unit) {
      unit.questions.forEach(q => {
        quizQuestions.push({ ...q, unitName: unit.name });
      });
    }
  });
  // shuffle
  quizQuestions = quizQuestions.sort(() => Math.random() - 0.5);

  currentIdx = 0;
  score = 0;
  wrongAnswers = [];
  totalTime = 0;
  startTime = Date.now();

  showView('quiz');
  document.getElementById('q-total').textContent = quizQuestions.length;
  renderQuestion();
}

function renderQuestion() {
  const q = quizQuestions[currentIdx];
  answered = false;

  document.getElementById('q-current').textContent = currentIdx + 1;
  document.getElementById('progress-fill').style.width =
    ((currentIdx / quizQuestions.length) * 100) + '%';
  document.getElementById('q-unit-tag').textContent = q.unitName;
  document.getElementById('q-text').textContent = q.q;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-num">${i + 1}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i));
    list.appendChild(btn);
  });

  document.getElementById('explain-box').classList.remove('show');
  document.getElementById('btn-next').classList.remove('show');

  // timer
  clearInterval(timerInterval);
  timeLeft = 30;
  updateTimer();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) autoFail();
    }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timer-display');
  const badge = document.getElementById('timer-badge');
  el.textContent = timeLeft;
  badge.classList.toggle('warning', timeLeft <= 10);
}

function autoFail() {
  const q = quizQuestions[currentIdx];
  answered = true;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    if (i === q.ans) btn.classList.add('correct');
    else btn.classList.add('neutral');
  });
  wrongAnswers.push({ q: q.q, yourAns: '시간 초과', correctAns: q.opts[q.ans], exp: q.exp });
  showExplain(q.exp);
  document.getElementById('btn-next').classList.add('show');
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q = quizQuestions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');

  btns.forEach((btn, i) => {
    if (i === q.ans) btn.classList.add('correct');
    else if (i === idx && idx !== q.ans) btn.classList.add('wrong');
    else btn.classList.add('neutral');
  });

  if (idx === q.ans) {
    score++;
    document.body.classList.add('flash-correct');
    setTimeout(() => document.body.classList.remove('flash-correct'), 500);
  } else {
    wrongAnswers.push({
      q: q.q,
      yourAns: q.opts[idx],
      correctAns: q.opts[q.ans],
      exp: q.exp
    });
    document.body.classList.add('flash-wrong');
    setTimeout(() => document.body.classList.remove('flash-wrong'), 500);
  }

  showExplain(q.exp);
  document.getElementById('btn-next').classList.add('show');
}

function showExplain(text) {
  const box = document.getElementById('explain-box');
  document.getElementById('explain-text').textContent = text;
  box.classList.add('show');
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizQuestions.length) {
    showResult();
  } else {
    document.getElementById('btn-next').classList.remove('show');
    document.getElementById('explain-box').classList.remove('show');
    renderQuestion();
  }
}

// ══════════════════════════════════════════
//  RESULT
// ══════════════════════════════════════════
function showResult() {
  clearInterval(timerInterval);
  totalTime = Math.round((Date.now() - startTime) / 1000);

  const total = quizQuestions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('result-score').textContent = pct + '점';

  let label, sub;
  if (pct >= 90) { label = '🎉 완벽해요!'; sub = '생명과학 마스터 달성!'; }
  else if (pct >= 70) { label = '👍 잘했어요!'; sub = '조금만 더 공부하면 완벽합니다.'; }
  else if (pct >= 50) { label = '📖 열심히 해요!'; sub = '취약 단원을 다시 공부해보세요.'; }
  else { label = '💪 다시 도전!'; sub = '요점정리를 읽고 다시 풀어보세요.'; }

  document.getElementById('result-label').textContent = label;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('res-correct').textContent = score;
  document.getElementById('res-wrong').textContent = total - score;
  document.getElementById('res-time').textContent = totalTime + 's';

  // wrong review
  const section = document.getElementById('review-section');
  if (wrongAnswers.length > 0) {
    let html = '<div class="review-title">오답 노트</div>';
    wrongAnswers.forEach(w => {
      html += `
        <div class="review-item">
          <div class="review-item-q">${w.q}</div>
          <div class="review-item-row">
            <span class="ri-wrong">✗ ${w.yourAns}</span>
            <span class="ri-correct">✓ ${w.correctAns}</span>
          </div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:8px;line-height:1.6;">${w.exp}</div>
        </div>
      `;
    });
    section.innerHTML = html;
  } else {
    section.innerHTML = '<div class="review-title">오답 없음 — 완벽한 풀이!</div>';
  }

  showView('result');
  document.getElementById('progress-fill').style.width = '100%';
}

function retryQuiz() {
  selectedUnits = [...selectedForRetry];
  startQuiz();
}

function goHome() {
  clearInterval(timerInterval);
  showView('home');
}

// ══════════════════════════════════════════
//  UTIL
// ══════════════════════════════════════════
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Start
init();
</script>
</body>
</html>
